name: CI

on:
  push:
  pull_request:

jobs:
  js-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check every ES module
        run: |
          for f in static/js/*.js; do
            node --check "$f"
          done

  mock-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mock server serves a SPEC-conformant API
        run: |
          python3 tools/mock_server.py 8091 > mock.log 2>&1 &
          MOCK_PID=$!
          code=""
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8091/api/health || true)
            [ "$code" = "200" ] && break
            sleep 0.5
          done
          echo "health: $code"
          [ "$code" = "200" ]
          curl -s http://127.0.0.1:8091/api/health | grep -q '"ok": *true'
          index_code=$(curl -s -o index.html -w '%{http_code}' http://127.0.0.1:8091/)
          echo "index: $index_code ($(wc -c < index.html) bytes)"
          [ "$index_code" = "200" ]
          grep -qi '<html' index.html
          kill "$MOCK_PID"
          cat mock.log

  sync-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Device repos are not siblings on CI runners; the check itself skips
      # missing dirs, so this job passes standalone and becomes meaningful
      # in workspaces where the sibling checkouts exist.
      - name: Frontend copies match this source of truth
        run: tools/check_sync.sh
